name: chitito-web
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chitito}
      MYSQL_USER: ${DB_USERNAME:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--innodb-buffer-pool-size=128M"]
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
  app:
    build: {context: ., dockerfile: infrastructure/backend.Dockerfile}
    image: chitito-backend:local
    restart: unless-stopped
    environment: &backend_environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_KEY: ${APP_KEY:?required}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-chitito}
      DB_USERNAME: ${DB_USERNAME:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
    depends_on: {db: {condition: service_healthy}}
    networks: [internal]
    volumes: ["app-storage:/var/www/storage"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "php", "artisan", "chitito:health"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 384m
  mqtt:
    image: chitito-backend:local
    restart: unless-stopped
    command: ["php", "artisan", "mqtt:consume"]
    environment:
      <<: *backend_environment
      MQTT_HOST: ${MQTT_HOST:?required}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USERNAME: ${MQTT_USERNAME:?required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?required}
      MQTT_CA: /run/mqtt/ca.crt
    depends_on: {app: {condition: service_healthy}}
    networks: [internal, outbound]
    volumes:
      - ${MQTT_CA_FILE:?required}:/run/mqtt/ca.crt:ro
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "php", "artisan", "chitito:mqtt-health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 256m
  web:
    build: {context: ., dockerfile: infrastructure/web.Dockerfile}
    restart: unless-stopped
    depends_on: {app: {condition: service_healthy}}
    ports: ["127.0.0.1:8443:8443", "80:80", "443:443"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?required}
      NGINX_ENVSUBST_FILTER: '^PUBLIC_IP'
    volumes:
      - ./infrastructure/private/webtls:/run/webtls:ro
      - ./infrastructure/private/acme/production:/etc/letsencrypt:ro
      - ./infrastructure/private/acme/webroot:/var/www/acme:ro
      - ./infrastructure/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infrastructure/nginx-app.conf:/etc/nginx/snippets/chitito-app.conf:ro
    networks: [internal, outbound]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
networks:
  internal: {internal: true}
  outbound: {}
volumes:
  mysql-data:
  app-storage:
