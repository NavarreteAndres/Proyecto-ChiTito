server {
    listen 80;
    listen [::]:80;
    server_name 15.235.63.174;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://15.235.63.174$request_uri; }
}
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/webtls/server.crt;
    ssl_certificate_key /run/webtls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/chitito-app.conf;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 15.235.63.174;
    if ($host != 15.235.63.174) { return 444; }
    ssl_certificate /etc/letsencrypt/live/chitito-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chitito-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ChiTitoTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/chitito-app.conf;
}
