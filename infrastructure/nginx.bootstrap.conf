# Only HTTP and private TLS are exposed before production certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name ${PUBLIC_IP};
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://${PUBLIC_IP}$request_uri; }
}
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/webtls/server.crt;
    ssl_certificate_key /run/webtls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/chitito-app.conf;
}
